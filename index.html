<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Equipo - IED José Francisco Socarrás</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .documento {
            background-color: white;
            width: 700px;
            padding: 25px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            position: relative;
        }
        .logo {
            width: 60px;
            height: 60px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            top: 25px;
            right: 25px;
        }
        .encabezado-texto {
            margin-right: 80px;
            line-height: 1.3;
            margin-bottom: 30px;
        }
        .icono-deporte {
            width: 60px;
            height: 50px;
            background-color: #333;
            position: absolute;
            bottom: 25px;
            right: 25px;
        }
        .tabla-principal {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .tabla-principal th, .tabla-principal td {
            border: 1px solid black;
            padding: 5px;
            vertical-align: top;
        }
        .tabla-principal th {
            background-color: #888;
            color: white;
            text-align: center;
            font-weight: bold;
        }
        .campo-fijo {
            border: none;
            background: transparent;
            width: 100%;
            font-size: 1em;
            pointer-events: none;
        }
        .campo-editable {
            border: none;
            border-bottom: 1px solid black;
            width: 100%;
            font-size: 1em;
            padding: 2px 0;
            background: transparent;
        }
        .fila-encabezado td {
            padding: 5px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .btn-enviar {
            display: block;
            margin: 20px auto 0;
            padding: 10px 25px;
            background-color: #25d366;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
        }
        .btn-enviar:hover {
            background-color: #128c7e;
        }
    </style>
</head>
<body>
    <div class="documento">
        <div class="logo"></div>

        <div class="encabezado-texto">
            <p>IED JOSÉ FRANCISCO SOCARRÁS</p>
            <p>PROYECTO PEDAGÓGICO TRANSVERSAL</p>
            <p>PROYECTO DE APROVECHAMIENTO DEL TIEMPO LIBRE</p>
            <p>NUESTRO ARTE ES EL DEPORTE</p>
            <p>ÁREA DE EDUCACIÓN FÍSICA</p>
        </div>

        <div class="icono-deporte"></div>

        <table class="tabla-principal">
            <tr class="fila-encabezado">
                <td colspan="2">
                    <label>CAPITÁN</label>
                    <input type="text" id="capitan" class="campo-editable" required>
                </td>
                <td colspan="3">
                    <label>COLOR DEL UNIFORME</label>
                    <input type="text" id="colorUniforme" class="campo-editable" required>
                </td>
            </tr>
            <tr>
                <th>N°</th>
                <th>NOMBRE DEL JUGADOR</th>
                <th>EDAD</th>
                <th>CURSO</th>
                <th>TARJETA DE IDENTIDAD</th>
            </tr>
            <tr>
                <td><input type="text" class="campo-fijo" value="1." readonly></td>
                <td><input type="text" class="campo-editable" id="jug1Nom" required></td>
                <td><input type="number" class="campo-editable" id="jug1Edad" min="5" max="100" required></td>
                <td><input type="text" class="campo-editable" id="jug1Cur" required></td>
                <td><input type="text" class="campo-editable" id="jug1Ti" required></td>
            </tr>
            <tr>
                <td><input type="text" class="campo-fijo" value="2." readonly></td>
                <td><input type="text" class="campo-editable" id="jug2Nom" required></td>
                <td><input type="number" class="campo-editable" id="jug2Edad" min="5" max="100" required></td>
                <td><input type="text" class="campo-editable" id="jug2Cur" required></td>
                <td><input type="text" class="campo-editable" id="jug2Ti" required></td>
            </tr>
            <tr>
                <td><input type="text" class="campo-fijo" value="3." readonly></td>
                <td><input type="text" class="campo-editable" id="jug3Nom" required></td>
                <td><input type="number" class="campo-editable" id="jug3Edad" min="5" max="100" required></td>
                <td><input type="text" class="campo-editable" id="jug3Cur" required></td>
                <td><input type="text" class="campo-editable" id="jug3Ti" required></td>
            </tr>
            <tr>
                <td><input type="text" class="campo-fijo" value="4." readonly></td>
                <td><input type="text" class="campo-editable" id="jug4Nom" required></td>
                <td><input type="number" class="campo-editable" id="jug4Edad" min="5" max="100" required></td>
                <td><input type="text" class="campo-editable" id="jug4Cur" required></td>
                <td><input type="text" class="campo-editable" id="jug4Ti" required></td>
            </tr>
            <tr>
                <td><input type="text" class="campo-fijo" value="5." readonly></td>
                <td><input type="text" class="campo-editable" id="jug5Nom" required></td>
                <td><input type="number" class="campo-editable" id="jug5Edad" min="5" max="100" required></td>
                <td><input type="text" class="campo-editable" id="jug5Cur" required></td>
                <td><input type="text" class="campo-editable" id="jug5Ti" required></td>
            </tr>
            <tr>
                <td><input type="text" class="campo-fijo" value="6." readonly></td>
                <td><input type="text" class="campo-editable" id="jug6Nom" required></td>
                <td><input type="number" class="campo-editable" id="jug6Edad" min="5" max="100" required></td>
                <td><input type="text" class="campo-editable" id="jug6Cur" required></td>
                <td><input type="text" class="campo-editable" id="jug6Ti" required></td>
            </tr>
            <tr>
                <td><input type="text" class="campo-fijo" value="7." readonly></td>
                <td><input type="text" class="campo-editable" id="jug7Nom" required></td>
                <td><input type="number" class="campo-editable" id="jug7Edad" min="5" max="100" required></td>
                <td><input type="text" class="campo-editable" id="jug7Cur" required></td>
                <td><input type="text" class="campo-editable" id="jug7Ti" required></td>
            </tr>
            <tr>
                <td><input type="text" class="campo-fijo" value="8." readonly></td>
                <td><input type="text" class="campo-editable" id="jug8Nom" required></td>
                <td><input type="number" class="campo-editable" id="jug8Edad" min="5" max="100" required></td>
                <td><input type="text" class="campo-editable" id="jug8Cur" required></td>
                <td><input type="text" class="campo-editable" id="jug8Ti" required></td>
            </tr>
            <tr>
                <td><input type="text" class="campo-fijo" value="9." readonly></td>
                <td><input type="text" class="campo-editable" id="jug9Nom" required></td>
                <td><input type="number" class="campo-editable" id="jug9Edad" min="5" max="100" required></td>
                <td><input type="text" class="campo-editable" id="jug9Cur" required></td>
                <td><input type="text" class="campo-editable" id="jug9Ti" required></td>
            </tr>
            <tr>
                <td><input type="text" class="campo-fijo" value="10." readonly></td>
                <td><input type="text" class="campo-editable" id="jug10Nom" required></td>
                <td><input type="number" class="campo-editable" id="jug10Edad" min="5" max="100" required></td>
                <td><input type="text" class="campo-editable" id="jug10Cur" required></td>
                <td><input type="text" class="campo-editable" id="jug10Ti" required></td>
            </tr>
        </table>

        <button class="btn-enviar" onclick="enviarDatos()">ENVIAR DATOS</button>
    </div>

    <script>
        function enviarDatos() {
            // Plantilla formateada para WhatsApp
            let mensaje = "📋 *FORMULARIO DE REGISTRO DE EQUIPO*\n";
            mensaje += "🏫 *INSTITUCIÓN:* IED JOSÉ FRANCISCO SOCARRÁS\n";
            mensaje += "📌 *PROYECTO:* Aprovechamiento del Tiempo Libre - Deporte\n\n";
            
            mensaje += "⚽ *DATOS DEL EQUIPO:*\n";
            mensaje += "• Capitán: " + document.getElementById('capitan').value + "\n";
            mensaje += "• Color del Uniforme: " + document.getElementById('colorUniforme').value + "\n\n";
            
            mensaje += "👥 *LISTA DE JUGADORES:*\n";
            mensaje += "-------------------------------------------------\n";
            mensaje += "N° | NOMBRE               | EDAD | CURSO | TI\n";
            mensaje += "-------------------------------------------------\n";

            for (let i = 1; i <= 10; i++) {
                let nom = document.getElementById('jug' + i + 'Nom').value.padEnd(20, ' ').slice(0,20);
                let edad = document.getElementById('jug' + i + 'Edad').value.padEnd(4, ' ').slice(0,4);
                let curso = document.getElementById('jug' + i + 'Cur').value.padEnd(5, ' ').slice(0,5);
                let ti = document.getElementById('jug' + i + 'Ti').value;
                
                mensaje += i + ".  | " + nom + " | " + edad + " | " + curso + " | " + ti + "\n";
            }
            mensaje += "-------------------------------------------------\n";
            mensaje += "✅ *Datos enviados desde el formulario oficial*";

            // Codificar mensaje y abrir WhatsApp
            let mensajeCodificado = encodeURIComponent(mensaje);
            let numero = "573133604710";
            window.open("https://wa.me/" + numero + "?text=" + mensajeCodificado, '_blank');
        }
    </script>
</body>
</html>
